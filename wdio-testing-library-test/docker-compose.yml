services:
  caddy:
    image: caddy:2.4.6-alpine
    ports:
      - "${JSMINTS_WDIO_HTTP_PORT:-80}:80"
      - "${JSMINTS_WDIO_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./src/jsE2eTest/resources/com/zegreatrob/wrapper/wdio/testing/library:/content
      - ~/caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases:
          - static.localhost
volumes:
  caddy_config:
